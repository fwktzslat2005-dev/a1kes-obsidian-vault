<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <style>
      text { font-family: "SimSun", "Microsoft YaHei", Arial, sans-serif; font-size: 18px; fill: #111; }
      .title { font-size: 28px; font-weight: 700; }
      .small { font-size: 15px; }
      .tiny { font-size: 13px; }
      .line { stroke: #111; stroke-width: 2.2; fill: none; }
      .thin { stroke: #111; stroke-width: 1.4; fill: none; }
      .box { stroke: #111; stroke-width: 1.8; fill: #fff; }
      .panel { stroke: #111; stroke-width: 1.4; fill: none; }
      .bus { stroke: #111; stroke-width: 4; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
  </defs>

  <text x="500" y="38" class="title">各类设备并网结构示意图</text>

  <!-- Panel 1 AC PV -->
  <rect x="50" y="70" width="620" height="250" class="panel"/>
  <text x="70" y="100">1. 交流侧光伏并网链路</text>
  <rect x="80" y="150" width="105" height="58" class="box"/>
  <text x="98" y="183" class="small">光伏阵列</text>
  <line x1="185" y1="179" x2="240" y2="179" class="line" marker-end="url(#arrow)"/>
  <rect x="240" y="150" width="110" height="58" class="box"/>
  <text x="258" y="174" class="small">DC/DC</text>
  <text x="258" y="196" class="small">MPPT</text>
  <line x1="350" y1="179" x2="405" y2="179" class="line" marker-end="url(#arrow)"/>
  <line x1="405" y1="152" x2="405" y2="206" class="bus"/>
  <text x="382" y="230" class="small">直流母线</text>
  <line x1="405" y1="179" x2="460" y2="179" class="line" marker-end="url(#arrow)"/>
  <rect x="460" y="150" width="105" height="58" class="box"/>
  <text x="476" y="183" class="small">并网逆变器</text>
  <line x1="565" y1="179" x2="612" y2="179" class="line" marker-end="url(#arrow)"/>
  <rect x="612" y="150" width="38" height="58" class="box"/>
  <text x="620" y="183" class="tiny">滤波</text>
  <text x="84" y="262" class="small">标注：交流大微网 200kW；交流小微网 50kW</text>
  <line x1="650" y1="179" x2="660" y2="179" class="line"/>
  <line x1="660" y1="132" x2="660" y2="226" class="bus"/>
  <text x="588" y="252" class="small">交流母线</text>

  <!-- Panel 2 DC PV -->
  <rect x="730" y="70" width="620" height="250" class="panel"/>
  <text x="750" y="100">2. 直流侧光伏接入链路</text>
  <rect x="770" y="150" width="115" height="58" class="box"/>
  <text x="790" y="183" class="small">光伏阵列</text>
  <line x1="885" y1="179" x2="950" y2="179" class="line" marker-end="url(#arrow)"/>
  <rect x="950" y="150" width="125" height="58" class="box"/>
  <text x="972" y="174" class="small">DC/DC</text>
  <text x="970" y="196" class="small">MPPT</text>
  <line x1="1075" y1="179" x2="1160" y2="179" class="line" marker-end="url(#arrow)"/>
  <line x1="1160" y1="132" x2="1160" y2="226" class="bus"/>
  <text x="1132" y="252" class="small">DC 母线</text>
  <text x="770" y="262" class="small">标注：直流小微网光伏 100kW</text>

  <!-- Panel 3 Wind -->
  <rect x="50" y="365" width="620" height="250" class="panel"/>
  <text x="70" y="395">3. 直驱永磁同步风力发电并网链路</text>
  <circle cx="108" cy="480" r="28" class="line"/>
  <path d="M108 480 L108 442 M108 480 L78 496 M108 480 L138 496" class="thin"/>
  <text x="72" y="536" class="small">风轮</text>
  <line x1="136" y1="480" x2="190" y2="480" class="line" marker-end="url(#arrow)"/>
  <rect x="190" y="452" width="95" height="56" class="box"/>
  <text x="203" y="476" class="small">PMSG</text>
  <text x="202" y="498" class="tiny">永磁同步机</text>
  <line x1="285" y1="480" x2="332" y2="480" class="line" marker-end="url(#arrow)"/>
  <rect x="332" y="452" width="86" height="56" class="box"/>
  <text x="350" y="486" class="small">整流器</text>
  <line x1="418" y1="480" x2="466" y2="480" class="line" marker-end="url(#arrow)"/>
  <line x1="466" y1="446" x2="466" y2="514" class="bus"/>
  <text x="436" y="540" class="small">直流环节</text>
  <line x1="466" y1="480" x2="514" y2="480" class="line" marker-end="url(#arrow)"/>
  <rect x="514" y="452" width="88" height="56" class="box"/>
  <text x="536" y="486" class="small">逆变器</text>
  <line x1="602" y1="480" x2="650" y2="480" class="line" marker-end="url(#arrow)"/>
  <line x1="650" y1="438" x2="650" y2="522" class="bus"/>
  <text x="578" y="540" class="small">交流母线</text>
  <text x="88" y="578" class="small">标注：直驱风力发电 50kW，接入交流大微电网 380V 母线</text>

  <!-- Panel 4 AC ESS -->
  <rect x="730" y="365" width="620" height="250" class="panel"/>
  <text x="750" y="395">4. 交流侧储能双向 PCS 接入链路</text>
  <rect x="770" y="452" width="118" height="56" class="box"/>
  <text x="790" y="476" class="small">电池组</text>
  <text x="802" y="498" class="small">BMS</text>
  <line x1="888" y1="480" x2="960" y2="480" class="line" marker-end="url(#arrow)"/>
  <rect x="960" y="452" width="140" height="56" class="box"/>
  <text x="984" y="476" class="small">双向 PCS</text>
  <text x="988" y="498" class="tiny">充/放电</text>
  <line x1="1100" y1="480" x2="1170" y2="480" class="line" marker-end="url(#arrow)"/>
  <rect x="1170" y="452" width="60" height="56" class="box"/>
  <text x="1186" y="486" class="small">QF</text>
  <line x1="1230" y1="480" x2="1306" y2="480" class="line" marker-end="url(#arrow)"/>
  <line x1="1306" y1="438" x2="1306" y2="522" class="bus"/>
  <text x="1230" y="548" class="small">交流母线</text>
  <text x="770" y="578" class="small">标注：大微网 250kW×2h；交流小微网 50kW×2h</text>

  <!-- Panel 5 DC ESS -->
  <rect x="50" y="660" width="620" height="250" class="panel"/>
  <text x="70" y="690">5. 直流侧储能双向 DC/DC 接入链路</text>
  <rect x="90" y="748" width="118" height="56" class="box"/>
  <text x="110" y="772" class="small">电池组</text>
  <text x="122" y="794" class="small">BMS</text>
  <line x1="208" y1="776" x2="300" y2="776" class="line" marker-end="url(#arrow)"/>
  <rect x="300" y="748" width="138" height="56" class="box"/>
  <text x="320" y="782" class="small">双向 DC/DC</text>
  <line x1="438" y1="776" x2="542" y2="776" class="line" marker-end="url(#arrow)"/>
  <line x1="542" y1="730" x2="542" y2="824" class="bus"/>
  <text x="512" y="850" class="small">DC 母线</text>
  <text x="90" y="865" class="small">标注：直流小微网储能 100kW×2h</text>

  <!-- Panel 6 DC Charging load -->
  <rect x="730" y="660" width="620" height="250" class="panel"/>
  <text x="750" y="690">6. 直流充电负荷接入链路</text>
  <line x1="800" y1="730" x2="800" y2="824" class="bus"/>
  <text x="770" y="850" class="small">DC 母线</text>
  <line x1="800" y1="776" x2="910" y2="776" class="line" marker-end="url(#arrow)"/>
  <rect x="910" y="748" width="168" height="56" class="box"/>
  <text x="934" y="772" class="small">直流保护</text>
  <text x="928" y="794" class="small">充电控制设备</text>
  <line x1="1078" y1="776" x2="1180" y2="776" class="line" marker-end="url(#arrow)"/>
  <rect x="1180" y="748" width="120" height="56" class="box"/>
  <text x="1200" y="772" class="small">充电负荷</text>
  <text x="1220" y="794" class="small">80kW</text>
  <text x="770" y="870" class="small">功率缺额时可降功率或暂停充电</text>
</svg>
